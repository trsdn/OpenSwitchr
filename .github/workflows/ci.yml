name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Warnings are treated as failures: this project has repeatedly found
      # real bugs behind warnings, so a warning is a finding, not noise.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      # The bundle build catches Info.plist and entitlements mistakes that a
      # plain `swift build` cannot see. Signing is unavailable on CI without
      # the release secrets, so only the unsigned packaging steps run here.
      - name: Verify app bundle packaging
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          if security find-identity -v -p codesigning | grep -q 'Developer ID Application'; then
            scripts/build-app.sh
          else
            echo "No signing identity on this runner; skipping bundle build."
          fi
