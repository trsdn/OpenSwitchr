name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.runner }})
    # macos-15 is not redundant with macos-latest: it is the SDK the release is
    # actually built on. The broker builds every published artifact on macos-15,
    # and a Swift 6 concurrency error that the macOS 26 SDK annotates away is a
    # hard error there. Testing only macos-latest let a green CI hand the broker
    # a tree that could not compile, which is the worst place to find out.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Show toolchain
        run: swift --version

      # Warnings are treated as failures: this project has repeatedly found
      # real bugs behind warnings, so a warning is a finding, not noise.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Check Swift formatting
        run: swift format lint --strict --recursive Sources Tests

      - name: Test
        run: swift test

      # Catches an Info.plist version typed by hand that has drifted away from
      # CHANGELOG.md, and identity keys AboutView reads back at runtime. Same
      # script an agent or a laptop runs, so there is one definition of the
      # check rather than two that disagree.
      - name: Check bundle metadata consistency
        run: bash scripts/check.sh --metadata-only

      # The bundle build catches Info.plist, entitlements and packaging mistakes
      # that a plain `swift build` cannot see, and it checks its own output for
      # the German localization and the notices. That check exists because 0.2.0
      # shipped English-only while every test was green: this runner's SwiftPM
      # copies string catalogs instead of compiling them. No certificate is
      # needed, so the bundle is built unsigned.
      - name: Verify app bundle packaging
        run: |
          set -euo pipefail
          bash scripts/build-app.sh --unsigned
