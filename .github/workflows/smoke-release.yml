name: Smoke test a release

# R05: checks the file a consumer downloads, not a local build. It runs when a
# release is published and can be run by hand for any tag. Read-only, no secret.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, such as v0.2.2. Empty means the latest.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test the published release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Run the smoke kit
        env:
          GH_TOKEN: ${{ github.token }}
          OPENSWITCHR_SMOKE_WAIT: "1"
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash scripts/smoke-release.sh $TAG
