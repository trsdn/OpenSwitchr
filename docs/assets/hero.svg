<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
  <title id="t">Illustration of the OpenSwitchr window switcher</title>
  <desc id="d">Two application windows stacked behind a switcher panel. The panel shows four window tiles, each with an icon and a title, the second one selected. An illustration, not a screenshot.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#2a4bd6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1330" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="720" height="440" rx="28" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="70" y="40" width="440" height="270" rx="16" fill="#dfe6ff"/>
    <rect x="70" y="40" width="440" height="34" rx="16" fill="#c9d5ff"/>
    <rect x="70" y="58" width="440" height="16" fill="#c9d5ff"/>
    <circle cx="94" cy="57" r="5" fill="#8ea6f5"/><circle cx="112" cy="57" r="5" fill="#8ea6f5"/><circle cx="130" cy="57" r="5" fill="#8ea6f5"/>
    <rect x="150" y="96" width="470" height="270" rx="16" fill="#f3f6ff"/>
    <rect x="150" y="96" width="470" height="34" rx="16" fill="#e2e9ff"/>
    <rect x="150" y="114" width="470" height="16" fill="#e2e9ff"/>
    <circle cx="174" cy="113" r="5" fill="#9fb3f7"/><circle cx="192" cy="113" r="5" fill="#9fb3f7"/><circle cx="210" cy="113" r="5" fill="#9fb3f7"/>
    <rect x="178" y="150" width="200" height="12" rx="6" fill="#c9d5ff"/>
    <rect x="178" y="176" width="330" height="10" rx="5" fill="#dfe6ff"/>
    <rect x="178" y="198" width="290" height="10" rx="5" fill="#dfe6ff"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="60" y="248" width="600" height="168" rx="22" fill="#0f1730" fill-opacity=".92"/>
    <rect x="60.5" y="248.5" width="599" height="167" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif" font-size="14" font-weight="500" fill="#e8ecff" text-anchor="middle">
    <rect x="84" y="270" width="124" height="98" rx="12" fill="#ffffff" fill-opacity=".07"/>
    <rect x="124" y="292" width="44" height="44" rx="11" fill="#5c6a99"/>
    <text x="146" y="358">Notes</text>

    <rect x="222" y="270" width="124" height="98" rx="12" fill="#ffffff" fill-opacity=".12" stroke="#7aa2ff" stroke-width="3"/>
    <rect x="262" y="292" width="44" height="44" rx="11" fill="url(#blue)"/>
    <rect x="272" y="303" width="24" height="9" rx="3" fill="#fff" fill-opacity=".55"/><rect x="272" y="315" width="24" height="12" rx="3" fill="#fff"/>
    <text x="284" y="358">Terminal</text>

    <rect x="360" y="270" width="124" height="98" rx="12" fill="#ffffff" fill-opacity=".07"/>
    <rect x="400" y="292" width="44" height="44" rx="11" fill="#5c6a99"/>
    <text x="422" y="358">Safari</text>

    <rect x="498" y="270" width="124" height="98" rx="12" fill="#ffffff" fill-opacity=".07"/>
    <rect x="538" y="292" width="44" height="44" rx="11" fill="#5c6a99"/>
    <text x="560" y="358">Mail</text>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif" font-size="13" fill="#9fb0e6" text-anchor="middle">
    <text x="360" y="396">Hold ⌘, press Tab. Type to filter. Release to switch.</text>
  </g>
</svg>
